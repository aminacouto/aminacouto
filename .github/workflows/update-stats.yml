name: Atualizar Estatísticas do GitHub

on:
  schedule:
    - cron: "0 0 * * *" # Executa todos os dias à meia-noite (UTC)
  workflow_dispatch: # Permite rodar manualmente

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v3

      - name: Baixar estatísticas do GitHub
        run: |
          curl -H "Authorization: token ${{ secrets.LINGUAGENS_UTILIZADAS_STATS_TOKEN }}" \
               "https://github-readme-stats.vercel.app/api/top-langs/?username=aminacouto&hide_progress=false&theme=radical&layout=compact&locale=pt-br" \
               -o stats.png

      - name: Commit & Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.png
          git commit -m "Atualizando estatísticas do GitHub" || echo "Nada para atualizar"
          git push
